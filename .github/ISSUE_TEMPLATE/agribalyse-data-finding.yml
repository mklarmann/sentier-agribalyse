name: AGRIBALYSE data finding
description: Identify an unexpected value, link, unit or other detail in an AGRIBALYSE release
title: "[Finding] "
# `needs-triage` means: no record of this finding has been merged yet. A maintainer takes it off.
labels: ["agribalyse-finding", "needs-triage"]
# The headings below are read by scripts/intake.py. To change one, read the note at the top of
# that script first; community/tests/test_workspace.py compares the two.
body:
  - type: markdown
    attributes:
      value: |
        Summarize the finding in one sentence. Name the release, file and process or food, then explain how another person can check it. Include units for any numbers.
        Keep licensed background data local. For an importer problem, open an ordinary issue.

        A maintainer records the finding and links the independent verification here. The record tracks submission to ADEME and any change in a later release.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of finding is it?
      options:
        - "Defect: something in the data looks wrong (an amount, a unit, a link, a label)"
        - "Question: what does the data mean or intend?"
        - "Difference: a difference in method, scope or convention, not an error"
    validations:
      required: true
  - type: dropdown
    id: releases
    attributes:
      label: ADEME release it was observed in
      description: Choose every release in which you saw it.
      multiple: true
      # releases:start (written by `python3 scripts/intake.py form` from site/config.json)
      options:
        - "3.2"
      # releases:end
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: What else it concerns
      description: "What the finding is about: the process or the group of processes by name, as ADEME's export writes it, with unit and geography, and for a single process its process identifier from the export; or an elementary flow, a method, a file of the release."
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: What the data says
      description: The value with its unit and the exchange it sits on, what you compared it with, and why it looks wrong. If it is a question to ADEME, put the question here.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: How you measured it
      description: Name the release file and the steps to check the finding. Include a command only if one is needed.
    validations:
      required: true
  - type: textarea
    id: exposure
    attributes:
      label: What it affects, if known
      description: Which other processes use this one, and how much of a typical result it changes.
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: A suggested correction, links to related discussions.
