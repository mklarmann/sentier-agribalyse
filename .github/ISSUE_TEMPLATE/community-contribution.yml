name: Contribution
description: A proposed mapping, model, parameter scenario or method variant, with its evidence
title: "[Contribution] "
labels: ["contribution"]
body:
  - type: markdown
    attributes:
      value: |
        A contribution is a proposal with evidence. It keeps its own name and never replaces ADEME's numbers.
        A maintainer adds a record for the contribution; its status follows the review. ADEME decides what it changes.
  - type: input
    id: baseline
    attributes:
      label: AGRIBALYSE release and the import it builds on
      description: The release, and the repository and revision of the import you started from.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What you propose, and the evidence for it
      description: Link public evidence or summaries you may share. Keep licensed inputs local.
    validations:
      required: true
  - type: textarea
    id: application
    attributes:
      label: How to apply it, and how to compare it with the release
    validations:
      required: true
  - type: textarea
    id: review
    attributes:
      label: Who should review it, alternatives and objections
  - type: textarea
    id: upstream
    attributes:
      label: What to recommend to ADEME
      description: Say whether it is a change to the data, a variant that stands beside it, or a change to the import.
