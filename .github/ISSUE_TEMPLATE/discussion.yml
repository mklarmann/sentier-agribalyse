name: Discussion
description: A question or decision about the data, a method difference, or how a finding is reported to ADEME
title: "[Discussion] "
labels: ["discussion"]
body:
  - type: input
    id: topic
    attributes:
      label: Topic
      description: "One sentence: what should we decide, understand or change?"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Links: a finding (its page on the site or its issue), a release note of ADEME, a contribution, a paper."
  - type: textarea
    id: positions
    attributes:
      label: Options or positions so far
  - type: textarea
    id: settle
    attributes:
      label: What would settle it
      description: A measurement, an answer from ADEME, a decision by a named maintainer.
