name: Site

# Builds the site from the records and the issues and deploys it to GitHub Pages: after a push
# to main, once a day (so that "waiting since", the discussion counts
# stay current), when an
# issue is opened, closed or reopened, and on request. Pull requests are checked by checks.yml.
#
# The site is built from the records, the issues and the pages of prose. No file of ADEME's
# release and nothing from the ecoinvent background is an input, and no database is built.
#
# Labels do not start a build: a change of a record arrives as a push.

on:
  push:
    branches: [main, eaternity/integration]
  schedule:
    - cron: "23 5 * * *"
  issues:
    types: [opened, closed, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deployment at a time; a run that has started is never cancelled half way.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Verify inventory quality measurements
        run: uv run --frozen scripts/inventory_quality.py --check
      - name: Verify the comparison of source inputs
        run: python3 scripts/source_comparison.py --check
      - name: Build the site from the records and the issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The build refuses invalid records. A deploy needs the issues: when they cannot be
        # read the build fails, and the last published site stays. --built-by names this
        # repository: a copy that a fork builds says on every page that it is not the
        # published site. Links to source files lead to the repository and the branch this
        # run was made of, which is where those files are: on main of this repository that
        # is what site/config.json says anyway, on a fork it is the fork's branch.
        run: uv run --no-project --python 3.12 --with markdown==3.7 --with 'sentier-diagnostics @ git+https://github.com/sentier-dev/sentier-diagnostics@4fa50c94cd364abf40503cbc43b6656609d2375a' python scripts/build_site.py --last-run site/licensed-run.json --require-issues --built-by "$GITHUB_REPOSITORY" --source-repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --source-ref "$GITHUB_REF_NAME"
      - name: Check links, assets and published file types
        run: uv run --no-project --python 3.12 python scripts/check_site.py _site
      - name: Hand the site, and nothing else, to the deployment
        # Only a run on the default branch deploys (a scheduled run is always one).
        if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
